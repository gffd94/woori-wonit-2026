<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class='title' id="one" style="border: 5px solid yellow;" onclick="myfun()">짱구는</div>
  
    <div class='title' id="two" style="border: 5px solid pink;" onclick="myfun2()">못말려</div>
  
  <div id="three">
        <ul id="four">
            <li>훈이</li>
            <li>철수</li>
        </ul>
    </div>

    <script>
        // document.getElementById("아이디명"): html에 아이디 한개
        // document.getElementsByClassName(클래스명) : html에서 클래스 단위로 묶음
        // document.getElementsByTagName(태그명) 
        // document.querySelector(모두 혼용 가능) #id명, .클래스명

        function myfun() {
            // document.querySelector('#one').innerHTML = '<img src ="./jjanggu.png">';
            for(var i = 0; i< document.getElementsByClassName('title').length; i++) {
                document.getElementsByClassName('title')[i].innerHTML = '이미지 변경 완료';
            }
        }

        function myfun2() {
            document.getElementsByTagName('ul')[0].innerHTML = '<img src ="./jjanggu.png">';
        }

    </script>

</body>
</html>
